name: BXR Presentation Preflight
on:
  pull_request:
    paths:
      - 'presentation-skill/**'
      - '04_Graphics/Icons/**'
      - '.github/workflows/presentation-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install 'jsonschema>=4.18,<5' python-pptx lxml pillow
      - name: Validate presentation briefs and deck plan contracts
        run: python presentation-skill/tests/test_contracts.py
      - name: Check CIS asset references, approved PNG hashes, icon paths and test briefs
        run: python presentation-skill/scripts/preflight.py --repo .
      - name: Master / theme tests
        run: python presentation-skill/tests/test_master.py
      - name: Pipeline tests (--no-render, no LibreOffice needed)
        run: python presentation-skill/tests/test_pipeline.py
      - name: Phase 4 acceptance tests (revision flow, NL brief, determinism)
        run: python presentation-skill/tests/test_acceptance.py
      - name: Source catalog / layout registry / icon catalog tests (M1-M3)
        run: python presentation-skill/tests/test_catalog.py
      - name: 500-page (PMLD) second-pass layout tests
        run: python presentation-skill/tests/test_pmld_layouts.py
      - name: Aviation layout family tests (compare/timeline/map/team/product/gauge/quote)
        run: python presentation-skill/tests/test_aviation_layouts.py
      - name: Aviation content triggers and fallback tests
        run: python presentation-skill/tests/test_aviation_planner.py
      - name: Aviation extraction batches (image-free structural layouts)
        run: python presentation-skill/tests/test_extract_layouts.py
